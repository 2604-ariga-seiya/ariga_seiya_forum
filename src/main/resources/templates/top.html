<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>掲示板</title>
    <link th:href="@{/css/style.css}" rel="styleSheet">
</head>
<body>
<h2>掲示板</h2>
<form th:action="@{./}" method="get">
    <div class="filter-area">
        <label for="startDate">期間:</label>
        <input type="date" id="startDate" name="startDate" th:value="${startDate}">

        <span> ～ </span>

        <input type="date" id="endDate" name="endDate" th:value="${endDate}">
        <input type="text" id="category" name="category" th:value="${category}">
        <button type="submit">絞り込み</button>
    </div>
</form>

<div class="profile" th:if="${loginUser != null}">
    <div class="name">
        <span th:text="${loginUser.name}">ユーザー名</span>
    </div>
    <div class="account">
        @<span th:text="${loginUser.account}">アカウント</span>
    </div>
</div>

<div class="main-contents">
    <div class="header">
        <th:block th:if="${loginUser != null}">
            <a th:href="@{./}">ホーム</a>
            <a th:href="@{/setting}">設定</a>
            <a th:href="@{/logout}">ログアウト</a>
        </th:block>
    </div>

    <div class="errorMessages" th:if="${errorMessages != null and !errorMessages.empty}">
        <ul>
            <li th:each="errorMessage : ${errorMessages}" th:text="${errorMessage}">エラーメッセージ</li>
        </ul>
    </div>

    <div class="messages">
        <article class="post-card" th:each="message : ${messages}">

            <div class="message">
                <div class="name">
                    <span class="name" th:text="${message.name}">名前</span>
                </div>
                <div class="category" th:text="${message.category}">カテゴリー</div>
                <div class="title" th:text="${message.title}">件名</div>
                <div class="text" th:text="${message.content}">つぶやき内容</div>
                <span th:text="${#temporals.format(message.createdDate, 'yyyy/MM/dd HH:mm:ss')}"></span>
            </div>

            <th:block th:if="${loginUser != null and loginUser.id == message.userId}">
                <form th:action="@{/deleteMessage}" method="POST">
                    <input type="hidden" name="message_id" th:value="${message.id}">
                    <button type="submit" class="delete-button">削除</button>
                </form>
                <form th:action="@{/edit}" method="GET">
                    <input type="hidden" name="message_id" th:value="${message.id}">
                    <button type="submit">編集</button>
                </form>
            </th:block>

            <form th:action="@{/comment}" method="post">
                返信<br />
                <textarea name="text" cols="100" rows="5" class="tweet-box"></textarea>
                <br />
                <input type="hidden" name="message_id" th:value="${message.id}">
                <input type="submit" value="返信">
            </form>

            <th:block th:each="comment : ${comments}">
                <div class="comment-item" th:if="${comment.messageId == message.id}">
                <span class="comment-account-name">
                    <a th:href="@{./(user_id=${comment.userId})}" th:text="${comment.account}">コメントアカウント</a>
                </span>
                    <span class="name" th:text="${comment.name}">コメント名前</span>
                    <div class="comment-text" th:text="${comment.content}">コメント内容</div>
                    <div class="comment-date" th:text="${#temporals.format(comment.createdDate, 'yyyy/MM/dd HH:mm:ss')}"></div>
                </div>
            </th:block>

        </article>
    </div>

    <div class="copyright">Copyright(c)seiya ariga</div>
</div>
</body>
</html>
